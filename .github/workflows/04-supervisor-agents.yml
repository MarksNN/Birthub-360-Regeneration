name: "Birthub Regen / 04 - Supervisor e 394 Agentes"
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  agents:
    name: "Supervisor / RBAC / Catálogo 394"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: birthhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d birthhub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci_user:ci_test_password@localhost:5432/birthhub_ci?schema=public"
      NODE_ENV: test
      JWT_SECRET: "ci-only-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-regeneration
      - run: npm --prefix backend run db:push
      - run: npm --prefix backend run db:seed
      - name: Testar Supervisor e catálogo canônico
        run: npm --prefix backend run test:unit
